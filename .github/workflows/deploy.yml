name: Build and Deploy

# ---------------------------------------------------------------------------
# 推送 main 后自动构建并部署：
#   1. bundle install 安装 Jekyll 依赖
#   2. jekyll build 生成 _site
#   3. 把 _site 推送到 gh-pages 分支，由 GitHub Pages 托管
#
# 日常更新只需改 Markdown 文件并推送，不用在本机构建。
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
  workflow_dispatch: # 也可在 Actions 页面手动重跑

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies and build theme JS
        run: npm install --no-audit --no-fund && npm run build:js

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            .nojekyll
