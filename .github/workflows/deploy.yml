name: Deploy site

# ---------------------------------------------------------------------------
# 部署模式：本地预构建静态文件直传（无云端 Jekyll 构建）
#
# 本站已改为「本地构建 -> 直接推送 _site 静态文件到 gh-pages 分支」的模式：
#   - gh-pages 分支根目录包含 .nojekyll，GitHub Pages 直接托管静态文件，
#     不会再运行 Jekyll 构建。
#   - 因此云端不再需要（也不应）自动构建，否则会覆盖本地上传的静态产物。
#
# 更新站点的正确流程（见项目根目录 deploy-local.sh / deploy-local.bat）：
#   1. 本地运行 jekyll build 生成 _site
#   2. 将 _site 内容推送到 gh-pages 分支（脚本已封装）
#
# 本 workflow 保留为一个占位入口，仅手动触发时输出提示信息，
# 不会修改 gh-pages，也不会构建站点。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment mode notice
        run: |
          echo "::notice::本站采用本地预构建静态文件直传模式。"
          echo "::notice::请运行本地 deploy-local 脚本构建并推送到 gh-pages 分支。"
          echo "::notice::本 workflow 不会构建站点，也不会修改 gh-pages。"
