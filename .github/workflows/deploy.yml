name: Deploy site

# ---------------------------------------------------------------------------
# 部署模式：GitHub Actions 云端构建（推荐日常使用）
#
# 日常更新流程：
#   1. 本地改 Markdown / 配置 / 加图片
#   2. git push 到 main
#   3. 本 workflow 自动构建并部署到 gh-pages，1~3 分钟后线上生效
#
# 手动兜底：如果 Actions 因网络等原因失败，可在本地运行 deploy-local.bat
#          （本地构建后直接推 gh-pages），效果相同。
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持在 Actions 页面手动点按钮重跑

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          bundle exec jekyll build
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            .nojekyll
